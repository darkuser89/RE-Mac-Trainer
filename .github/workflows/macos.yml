name: macOS app

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MT_RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify native architecture
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          printf 'MT_TRAINER_BUILD_DIR=%s/RE2TrainerBuild\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify release history policy
        run: python3 -B Tests/test_publish_release.py
      - name: Build and run local regression checks
        run: ./script/build_and_run.sh --build-only
      - name: Package and verify app round trip
        run: ./script/package_release.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macOS-arm64
          path: ${{ runner.temp }}/RE2TrainerBuild/Release/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish versioned app release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: macOS-arm64
          path: release
      - name: Create release without modifying existing history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRAINER_COMMIT: ${{ github.sha }}
        run: python3 -B script/publish_release.py release
